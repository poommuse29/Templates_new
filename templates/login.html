{% extends "base.html" %}
{% block content %}
    <div class="py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header border-0 text-white text-center py-4" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
                        <div class="my-2">
                            <span class="d-inline-flex align-items-center justify-content-center bg-primary bg-gradient text-white rounded-circle shadow mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                                <i class="fas fa-lock"></i>
                            </span>
                            <h3 class="fw-bold mb-1">เข้าสู่ระบบ (Login)</h3>
                            <p class="text-white-50 small mb-0">กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าสู่ระบบ</p>
                        </div>
                    </div>

                    <div class="card-body p-4 p-sm-5 bg-white">
                        {% if form.errors %}
                            <div class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i> ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endif %}

                        <form method="POST" novalidate>
                            {% csrf_token %}

                            <div class="mb-4">
                                <label for="id_username" class="form-label fw-semibold text-secondary small">
                                    <i class="fas fa-user me-1 text-primary"></i> ชื่อผู้ใช้งาน (Username)
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fas fa-user"></i></span>
                                    <input class="form-control form-control-lg border-start-0 bg-light fs-6"
                                           id="id_username"
                                           name="username"
                                           type="text"
                                           placeholder="เช่น std_6401001"
                                           required />
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="id_password" class="form-label fw-semibold text-secondary small">
                                    <i class="fas fa-key me-1 text-primary"></i> รหัสผ่าน (Password)
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fas fa-lock"></i></span>
                                    <input class="form-control form-control-lg border-start-0 bg-light fs-6"
                                           id="id_password"
                                           name="password"
                                           type="password"
                                           placeholder="••••••••"
                                           required />
                                </div>
                            </div>

                            <div class="d-grid mt-4 pt-2">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm font-weight-bold py-3">
                                    <i class="fas fa-sign-in-alt me-2"></i> เข้าสู่ระบบ (Sign In)
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer bg-light border-0 py-3 text-center">
                        <span class="text-muted small me-1">ยังไม่มีบัญชีสมาชิก?</span>
                        <a href="{% url 'register' %}" class="fw-bold text-decoration-none text-primary small">
                            <i class="fas fa-user-plus me-1"></i> สมัครสมาชิกที่นี่ (Sign Up)
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
